name: Build Capacitor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build web app (with automatic entry detection)
  run: |
    # Crea un index.html básico
    cat > index.html << 'EOF'
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Nexus Admin</title>
    </head>
    <body>
      <div id="app"></div>
      <script type="module" src="/src/App.jsx"></script>
    </body>
    </html>
    EOF

    # Detecta automáticamente el punto de entrada real
    if [ -f "src/main.js" ]; then
      sed -i 's|/src/App.jsx|/src/main.js|g' index.html
    elif [ -f "src/index.js" ]; then
      sed -i 's|/src/App.jsx|/src/index.js|g' index.html
    elif [ -f "src/App.js" ]; then
      sed -i 's|/src/App.jsx|/src/App.js|g' index.html
    elif [ -f "src/index.tsx" ]; then
      sed -i 's|/src/App.jsx|/src/index.tsx|g' index.html
    fi
    
    npm run build
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Nexus-Admin-APK
        path: android/app/build/outputs/apk/debug/*.apk
